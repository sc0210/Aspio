[pytest]
# Pytest configuration for Aspiro backend tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --color=yes
    --durations=10
    --cov=app
    --cov-report=html:test-results/htmlcov
    --cov-report=term-missing
    --cov-report=xml:test-results/coverage.xml
    --cov-fail-under=77

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    database: marks tests that require database
    api: marks tests for API endpoints
    auth: marks tests for authentication
    demo: marks tests for demo mode
    isolation: marks tests for mode isolation

# Filter known third-party library warnings that cannot be fixed in user code
filterwarnings =
    ignore:coroutine 'Connection._cancel' was never awaited:RuntimeWarning
    ignore:The `__fields__` attribute is deprecated:DeprecationWarning
    ignore:The 'app' shortcut is now deprecated:DeprecationWarning:httpx
    ignore:'crypt' is deprecated:DeprecationWarning:passlib
    ignore:Please use `import python_multipart`:PendingDeprecationWarning:starlette

# Async test mode
asyncio_mode = strict

# Minimum version
minversion = 6.0

# Coverage options (if pytest-cov is installed)
# --cov=app
# --cov-report=html
# --cov-report=term-missing