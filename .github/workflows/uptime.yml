name: Uptime

# Production went dark around 2026-09-25 and nobody noticed for about ten days.
# The Pi hung, the deploy runner went offline with it, and every signal we had —
# the deploy alert, the backup log — lived ON the Pi, so they all went quiet
# together. Silence looked exactly like health.
#
# This probes home.aspiro.dev from a GitHub-hosted runner, which does not care
# whether the Pi is alive, and keeps one issue open for as long as the site is
# down:
#   down, no open issue  → open one; the run goes red (the one email you get)
#   down, issue open     → nothing; a red run every 15 minutes would bury the inbox
#   up,   issue open     → comment how long it was down, close it
#
# Two probes, because "the page loads" is not "the app works":
#   /                  → 200 from the Next.js frontend
#   /api/v1/users/me   → 401 from the backend: proves Caddy routes to FastAPI and
#                        the app answers, without needing a credential
# A 502 on the API with a 200 on the page is the frontend up and the backend not.
#
# Caveats worth knowing:
#   - GitHub delays and occasionally drops scheduled runs under load, so treat the
#     15 minutes as "within the hour", not a stopwatch.
#   - Scheduled workflows are disabled after 60 days without a commit to the repo.
#     GitHub emails before it happens; re-enable from the Actions tab.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      simulate_down:
        description: "Probe an unresolvable host instead, to exercise the outage path (opens the issue; a normal run closes it)"
        type: boolean
        default: false

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SITE: ${{ inputs.simulate_down && 'https://simulated-outage.invalid' || 'https://home.aspiro.dev' }}
      TITLE: "Production is down — home.aspiro.dev is not responding"
    steps:
      - name: Probe the site
        id: probe
        run: |
          set -uo pipefail
          # Three attempts a minute apart, so one dropped connection or a deploy
          # restarting the containers does not page anyone.
          for attempt in 1 2 3; do
            page=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$SITE/") || true
            api=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$SITE/api/v1/users/me") || true
            echo "attempt $attempt: / -> $page, /api/v1/users/me -> $api"
            if [ "$page" = "200" ] && [ "$api" = "401" ]; then
              echo "up=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 60
          done
          { echo "up=false"; echo "page=$page"; echo "api=$api"; } >> "$GITHUB_OUTPUT"

      # --repo on every gh call: there is no checkout, so gh has no remote to
      # infer the repository from.
      - name: Open the outage issue, or close it on recovery
        env:
          UP: ${{ steps.probe.outputs.up }}
          PAGE: ${{ steps.probe.outputs.page }}
          API: ${{ steps.probe.outputs.api }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Found by label, not by search: the search index lags new issues, and
          # an empty answer on recovery would leave the issue open forever — which
          # makes the NEXT outage look like "still down" and stay silent. Listing
          # by a label that does not exist yet just returns nothing.
          open=$(gh issue list --repo "$REPO" --state open --label uptime --limit 10 \
            --json number,title,createdAt \
            --jq "[.[] | select(.title==\"$TITLE\")][0] // empty")

          if [ "$UP" = "true" ]; then
            [ -z "$open" ] && { echo "up, nothing open"; exit 0; }
            number=$(jq -r .number <<<"$open")
            since=$(jq -r .createdAt <<<"$open")
            mins=$(( ( $(date -u +%s) - $(date -u -d "$since" +%s) ) / 60 ))
            gh issue close "$number" --repo "$REPO" \
              --comment "Back up: \`/\` returns 200 and the API returns 401 again. Down for at least ${mins} minutes (measured from when this issue was opened; probes run every ~15 minutes). Run: ${RUN_URL}"
            echo "recovered, closed #$number"
            exit 0
          fi

          if [ -n "$open" ]; then
            echo "still down, #$(jq -r .number <<<"$open") already open"
            exit 0
          fi

          body=$(cat <<EOF
          The uptime probe could not reach production after three attempts a minute apart.

          | Probe | Expected | Got |
          |---|---|---|
          | \`${SITE}/\` | 200 | ${PAGE} |
          | \`${SITE}/api/v1/users/me\` | 401 | ${API} |

          Run: ${RUN_URL}

          **Reading the codes:** \`000\` on both means nothing answered at all —
          the Pi is off, hung, or off the network, or the Cloudflare Tunnel is
          down. A \`502\`/\`530\` means Cloudflare answered but could not reach the
          Pi. A \`403\` on both is almost always Cloudflare **Bot Fight Mode**
          challenging GitHub's runner (Security → Analytics → Events will name it);
          it must stay off, since it blocks LINE's webhook the same way. A 200 page
          with a failing API is the backend alone.

          **First checks** (Tailscale on if you are away from home):

          \`\`\`
          ping 192.168.0.176
          ssh scdev@192.168.0.176 'uptime; systemctl is-active cloudflared; docker ps'
          \`\`\`

          If the Pi does not answer ping, power-cycle it. Containers restart on
          their own; nothing needs redeploying.

          This issue closes itself once the site answers again.
          EOF
          )
          # Said first, so the log names the outage even if opening the issue fails.
          # The run goes red on the transition only, so the email arrives once.
          echo "::error::home.aspiro.dev is down (/ -> ${PAGE}, API -> ${API})"

          # Only the down path needs the label, so only it creates one. --force makes
          # it idempotent; a failure warns rather than exits, and if the label really
          # is missing the create below fails loudly and the run goes red anyway.
          gh label create uptime --repo "$REPO" --color B60205 --force \
            --description "Opened and closed by uptime.yml" \
            || echo "::warning::could not create the uptime label"
          gh issue create --repo "$REPO" --title "$TITLE" --label uptime --body "$body"
          exit 1
