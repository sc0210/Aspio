# Maintenance page Worker: see README.md in this folder.
# Deploy: npx wrangler@4 deploy --config cloudflare/maintenance/wrangler.toml  (wrangler needs Node 22+)
name = "aspiro-maintenance"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

# The hostname the tunnel serves. Self-hosters: change both values to your own.
routes = [
  { pattern = "home.aspiro.dev/*", zone_name = "aspiro.dev" },
]
